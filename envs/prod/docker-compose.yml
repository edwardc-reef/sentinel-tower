x-logging: &logging
  driver: journald
  options:
    tag: '{{.Name}}'

services:
  redis:
    image: mirror.gcr.io/valkey/valkey:8.1-alpine
    command: valkey-server --appendonly yes
    healthcheck:
      test: valkey-cli ping
    restart: unless-stopped
    volumes:
      - ./redis/data:/data
    logging:
      <<: *logging

  db:
    image: postgres:14.0-alpine
    shm_size: 1gb
    # NOTE: every setting below is a `-c` command-line override, which outranks
    # both postgresql.conf and postgresql.auto.conf (ALTER SYSTEM). Two values
    # are currently set via ALTER SYSTEM on prod and are deliberately NOT
    # repeated here, so they keep working as-is:
    #   maintenance_work_mem = 256MB
    #   autovacuum_vacuum_cost_limit = 2000
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,auto_explain
      # Taken from postgres.auto.conf on prod system and set here for reproducibility
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - autovacuum_vacuum_cost_limit=${POSTGRES_AUTOVACUUM_VACUUM_COST_LIMIT:-2000}
      # --- memory -----------------------------------------------------------
      # Host has 7.7 GB RAM, no swap, ~4.3 GB already used by the app stack.
      # 1GB is an 8x increase over the 128MB default and fixes the
      # buffers_backend problem without gutting the OS page cache. Raise to 2GB
      # via .env once the host has more RAM -- see docs/postgres-tuning.md.
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}
      # shared_buffers + realistic page cache. Must NOT exceed what the machine
      # actually has free, or the planner overestimates how much is cached and
      # picks nested loops / index scans that then hit disk.
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-3GB}
      # 4MB default forces external merge sorts (disk spills) on dashboard
      # aggregates. Per sort node per connection -- do not raise casually.
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-32MB}
      # --- planner ----------------------------------------------------------
      # Data lives on a Hetzner Cloud Volume: SSD-backed but network-attached,
      # so seeks are cheaper than spinning rust (4) but dearer than local
      # NVMe (1.1).
      - -c
      - random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.5}
      # --- checkpoints / WAL ------------------------------------------------
      # 1GB default caused 115 forced (checkpoints_req) checkpoints and left
      # the DB writing checkpoints ~79% of wall-clock time.
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-4GB}
      - -c
      - min_wal_size=${POSTGRES_MIN_WAL_SIZE:-1GB}
      # --- observability ----------------------------------------------------
      # Populates blk_read_time / blk_write_time so cache misses become
      # measurable instead of inferred. Verify with `pg_test_timing`.
      - -c
      - track_io_timing=on
      # 5000 entries was evicting 89k times/day, so occasional Grafana
      # dashboard queries never survived long enough to be seen.
      - -c
      - pg_stat_statements.max=${POSTGRES_PGSS_MAX:-50000}
      # Logs full text + duration of anything slower than this (ms).
      - -c
      - log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION:-2000}
      - -c
      - log_checkpoints=on
      - -c
      - log_lock_waits=on
      # kB. Catches work_mem overflow spilling to disk.
      - -c
      - log_temp_files=${POSTGRES_LOG_TEMP_FILES:-10240}
      - -c
      - log_autovacuum_min_duration=10000
      # --- auto_explain: actual plans for slow queries -----------------------
      # log_timing=off is deliberate: per-node timing is the expensive part of
      # log_analyze, and this host is already CPU/IO saturated. log_buffers
      # gives "shared hit=X read=Y", which is what distinguishes a bad plan
      # from a cold cache.
      - -c
      - auto_explain.log_min_duration=${POSTGRES_AUTOEXPLAIN_MIN_DURATION:-5000}
      - -c
      - auto_explain.log_analyze=on
      - -c
      - auto_explain.log_buffers=on
      - -c
      - auto_explain.log_timing=off
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} || exit 1
    restart: unless-stopped
    env_file: ./.env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${POSTGRES_DATA_PATH:-./db/data}:/var/lib/postgresql/data
    logging:
      <<: *logging

  app:
    build:
      context: .
      dockerfile: app/envs/prod/Dockerfile
    image: project/app
    healthcheck:
      test: ["CMD", "./healthcheck.py", "/var/run/gunicorn/gunicorn.sock"]
    init: true
    restart: unless-stopped
    env_file: ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Add this variable to all containers that should dump Prometheus metrics.  Each container besides this one
      # should use a different subdirectory of /prometheus-multiproc-dir, e.g.
      # - PROMETHEUS_MULTIPROC_DIR=/prometheus-multiproc-dir/other-container
      # Don't forget to also mount the prometheus-metrics volume in other containers too.
      - PROMETHEUS_MULTIPROC_DIR=/prometheus-multiproc-dir
      - PROMETHEUS_USE_FLOCK=1
      - MEDIA_ROOT=${MEDIA_ROOT}
      # Migrations are applied manually (see deploy.sh) so long CONCURRENTLY
      # index builds don't block app startup.
      - AUTO_MIGRATE=${AUTO_MIGRATE:-0}
    volumes:
      - backend-static:/var/static
      - gunicorn-socket:/var/run/gunicorn
      - ${MEDIA_VOLUME_PATH:-./media}:${MEDIA_ROOT}
      # Add this mount to each container that should dump Prometheus metrics.
      - ./prometheus-metrics:/prometheus-multiproc-dir
    depends_on:
      - redis
      - db
    logging:
      <<: *logging

  block-scheduler:
    build:
      context: .
      dockerfile: app/envs/prod/Dockerfile
    image: block_dumper/app
    init: true
    restart: always
    env_file: ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ./block-scheduler-entrypoint.sh
    environment:
      - PROMETHEUS_MULTIPROC_DIR=/prometheus-multiproc-dir/block-scheduler
      - PROMETHEUS_USE_FLOCK=1
      - SENTINEL_MODE=${SENTINEL_MODE:-live}
      - BLOCK_START=${BLOCK_START:-}
      - BLOCK_END=${BLOCK_END:-}
      - BACKFILL_RATE_LIMIT=${BACKFILL_RATE_LIMIT:-1.0}
    volumes:
      - backend-static:/var/static
      - ${MEDIA_VOLUME_PATH:-./media}:${MEDIA_ROOT}
      - ./prometheus-metrics/block-scheduler:/prometheus-multiproc-dir/block-scheduler
    depends_on:
      - celery-worker
      - redis
      - db
    profiles:
      - scheduler
    logging:
      <<: *logging

  sync-extrinsics:
    image: project/app
    init: true
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'manage.py sync_extrinsics' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    env_file: ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MEDIA_ROOT=${MEDIA_ROOT}
    command: python manage.py sync_extrinsics
    volumes:
      - ${MEDIA_VOLUME_PATH:-./media}:${MEDIA_ROOT}
    depends_on:
      - redis
      - db
    logging:
      <<: *logging

  sync-metagraph:
    image: project/app
    init: true
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'manage.py sync_metagraph' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    env_file: ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MEDIA_ROOT=${MEDIA_ROOT}
    command: python manage.py sync_metagraph
    volumes:
      - ${MEDIA_VOLUME_PATH:-./media}:${MEDIA_ROOT}
    depends_on:
      - redis
      - db
    profiles:
      - metagraph
    logging:
      <<: *logging

  backfill-metagraph:
    image: project/app
    init: true
    env_file: ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MEDIA_ROOT=${MEDIA_ROOT}
    command: python manage.py backfill_metagraph
    volumes:
      - ${MEDIA_VOLUME_PATH:-./media}:${MEDIA_ROOT}
    profiles:
      - metagraph
    depends_on:
      - db
    logging:
      <<: *logging

  historical-metagraph-backfill:
    image: project/app
    init: true
    restart: unless-stopped
    env_file: ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MEDIA_ROOT=${MEDIA_ROOT}
    command: python manage.py historical_metagraph_backfill
    volumes:
      - ${MEDIA_VOLUME_PATH:-./media}:${MEDIA_ROOT}
    profiles:
      - historical-backfill
    depends_on:
      - db
    logging:
      <<: *logging

  backfill-extrinsics:
    image: project/app
    init: true
    env_file: ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MEDIA_ROOT=${MEDIA_ROOT}
    command: python manage.py backfill_extrinsics
    volumes:
      - ${MEDIA_VOLUME_PATH:-./media}:${MEDIA_ROOT}
    profiles:
      - backfill
    depends_on:
      - db
    logging:
      <<: *logging

  prune-retention:
    image: project/app
    init: true
    env_file: ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MEDIA_ROOT=${MEDIA_ROOT}
    # One-shot: `docker compose run --rm prune-retention` runs the default
    # command below. NOTE: anything after the service name REPLACES the
    # command (the entrypoint is just `gosu appuser`), so to pass flags spell
    # the whole command out, e.g.:
    #   docker compose run --rm prune-retention python manage.py prune_retention --dry-run
    #   docker compose run --rm prune-retention python manage.py prune_retention --max-batches 1000
    # Daily steady-state pruning runs via the cleanup-expired-data Celery beat
    # task; the shared advisory lock makes concurrent runs a no-op.
    command: python manage.py prune_retention
    volumes:
      - ${MEDIA_VOLUME_PATH:-./media}:${MEDIA_ROOT}
    profiles:
      - retention
    depends_on:
      - db
    logging:
      <<: *logging

  celery-worker:
    image: project/app
    init: true
    healthcheck:
      # Cheap pidfile liveness check: `celery -A project status` boots the whole
      # Django+Bittensor app (~2s of a full core) every interval. The entrypoint's
      # watchdog loop still runs a real `celery status` as the deep check.
      # The entrypoint runs one node for each declared queue: master consumes
      # "celery", while metagraph consumes "metagraph".
      test: ["CMD-SHELL", "for w in master metagraph; do kill -0 $$(cat /tmp/celery-$$w.pid) 2>/dev/null || exit 1; done"]
      interval: 30s
      timeout: 10s
    restart: unless-stopped
    env_file: ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 22g
    environment:
      - DEBUG=off
      - PROMETHEUS_MULTIPROC_DIR=/prometheus-multiproc-dir/celery-worker
      - PROMETHEUS_USE_FLOCK=1
      - MEDIA_ROOT=${MEDIA_ROOT}
      - SENTINEL_MODE=${SENTINEL_MODE:-live}
    command: ./celery-entrypoint.sh
    volumes:
      - ${MEDIA_VOLUME_PATH:-./media}:${MEDIA_ROOT}
      - ./prometheus-metrics/celery-worker:/prometheus-multiproc-dir/celery-worker
    tmpfs: /run
    depends_on:
      - redis
    logging:
      <<: *logging

  celery-beat:
    image: project/app
    init: true
    restart: unless-stopped
    env_file: ./.env
    environment:
      - DEBUG=off
    command: nice celery -A project beat -l INFO --schedule /tmp/celerybeat-schedule -f /tmp/logs/celery-beat.log
    volumes:
      - ./logs:/tmp/logs
    depends_on:
      - redis
    logging:
      <<: *logging

  celery-flower:
    image: project/app
    healthcheck:
      test: wget --user "${CELERY_FLOWER_USER}" --password "${CELERY_FLOWER_PASSWORD}" -qO- 127.0.0.1:5555 > /dev/null || exit 1
    init: true
    restart: unless-stopped
    env_file: ./.env
    environment:
      - DEBUG=off
      - FLOWER_TASK_RUNTIME_METRIC_BUCKETS=1,2,3,5,10,20,30,45,60,120,180,240,300,600,inf
    command: celery --app=project --broker="${CELERY_BROKER_URL}" flower --basic_auth="${CELERY_FLOWER_USER}:${CELERY_FLOWER_PASSWORD}" --max_tasks=500
    depends_on:
      - celery-worker
    ports:
      - 127.0.0.1:5555:5555
    logging:
      <<: *logging

  # dagster:
  #   image: project/app
  #   healthcheck:
  #     test: wget -qO- 127.0.0.1:3000/dagster/server_info > /dev/null || exit 1
  #   init: true
  #   restart: unless-stopped
  #   env_file: ./.env
  #   environment:
  #     - DEBUG=off
  #     - DAGSTER_HOME=/root/src
