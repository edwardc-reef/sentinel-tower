apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: PostgreSQL
    type: postgres
    uid: postgresql
    access: proxy
    url: db:5432
    database: $POSTGRES_DB
    # read-only role with statement_timeout and application_name=grafana, so dashboard
    # load is attributable separately from the sync daemons (see docs/README.md, "Database roles")
    user: $GRAFANA_READER_USER
    secureJsonData:
      password: $GRAFANA_READER_PASSWORD
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    editable: false
