global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'sentinel-business-metrics'
    metrics_path: /business-metrics
    static_configs:
      - targets: ['app:8000']
    scrape_interval: 60s

  - job_name: 'sentinel-django-metrics'
    metrics_path: /metrics
    static_configs:
      - targets: ['app:8000']
    scrape_interval: 60s

  # - job_name: 'celery-flower'
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ['celery-flower:5555']
  #   scrape_interval: 60s

  # node-exporter is reached through the host: prod runs it with network_mode: host
  # (so it has no name on the compose network), dev publishes 127.0.0.1:9100. Prod
  # prometheus maps host.docker.internal via extra_hosts; Docker Desktop resolves it
  # natively.
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
    scrape_interval: 30s

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s

  - job_name: 'block-scheduler'
    metrics_path: /metrics
    static_configs:
      - targets: ['block-scheduler:8000']
    scrape_interval: 60s

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s
 
  # Grafana's own metrics: request and data source plugin latency histograms,
  # shown on the "Grafana Query Timing" dashboard. Prometheus reads this file
  # only at start or on `curl -X POST http://127.0.0.1:9090/-/reload`.
  - job_name: 'grafana'
    metrics_path: /metrics
    static_configs:
      - targets: ['grafana:3000']
    scrape_interval: 30s

  # The external Grafana (grafana.bactensor.io, metagraph-grafana stack) whose
  # dashboards query this database over the mTLS proxy. Its /metrics answers
  # without auth on the ALB name; the CloudFront name only redirects.
  - job_name: 'grafana-external'
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ['internal.grafana.bactensor.io']
    scrape_interval: 30s
